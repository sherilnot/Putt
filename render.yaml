# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: puttum-beefum-api
    runtime: node
    plan: free
    region: singapore # closest Render region to Australia
    rootDir: backend
    buildCommand: npm ci
    # bootstrap is idempotent: creates the first admin/plans/slots once, then no-ops
    startCommand: node src/scripts/bootstrap.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Australia/Sydney
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
